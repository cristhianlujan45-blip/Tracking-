name: Desktop app (Windows + macOS)

on:
  workflow_dispatch:
  push:
    branches: [ccr-90c69cc6-siyqqi, main]
    paths: [backend/**, frontend/**, desktop/**, integrations/**, gpu_worker/**, .github/workflows/desktop.yml]
    tags: ["v*"]

permissions:
  contents: write

env:
  APP_VERSION: 1.0.${{ github.run_number }}
  # optional public repo that only hosts the installers (the code can stay private): in-app updates
  # download from it. Set the repository variable RELEASES_REPO (owner/name) and the secret RELEASES_TOKEN.
  UPDATE_REPO: ${{ vars.RELEASES_REPO || github.repository }}

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip }
      - run: pip install -r backend/requirements.txt -r backend/requirements-dev.txt
      - run: python -m pytest -q
        working-directory: backend

  windows:
    needs: tests
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip }
      - name: Install
        run: pip install -r backend/requirements.txt pywebview pyinstaller
      - name: Version
        shell: bash
        run: |
          sed -i.bak -e "s/^VERSION = .*/VERSION = \"$APP_VERSION\"/" -e "s#^UPDATE_REPO = .*#UPDATE_REPO = \"$UPDATE_REPO\"#" backend/app/_version.py
          rm -f backend/app/_version.py.bak
      - name: Build app
        run: pyinstaller desktop/forja3d.spec --noconfirm
      - name: Smoke test (starts the packaged server)
        shell: pwsh
        run: |
          $p = Start-Process dist\Forja3D\Forja3D.exe -ArgumentList '--server','--port','8799' -PassThru
          $ok = $false
          foreach ($i in 1..60) {
            try { if ((Invoke-WebRequest http://127.0.0.1:8799/api/health -UseBasicParsing).StatusCode -eq 200) { $ok = $true; break } } catch {}
            Start-Sleep 2
          }
          $html = (Invoke-WebRequest http://127.0.0.1:8799/ -UseBasicParsing).Content
          Stop-Process $p -Force
          if (-not $ok -or $html -notmatch 'FORJA') { Get-Content "$env:APPDATA\Forja3D\forja3d.log" -ErrorAction SilentlyContinue; exit 1 }
      - name: Installer (Inno Setup)
        shell: pwsh
        run: |
          Invoke-WebRequest https://go.microsoft.com/fwlink/p/?LinkId=2124703 -OutFile desktop\windows\MicrosoftEdgeWebview2Setup.exe
          if (-not (Get-Command iscc -ErrorAction SilentlyContinue)) { choco install innosetup -y --no-progress }
          $iscc = (Get-Command iscc -ErrorAction SilentlyContinue).Source
          if (-not $iscc) { $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" }
          & $iscc "/DAppVersion=$env:APP_VERSION" desktop\windows\forja3d.iss
      - uses: actions/upload-artifact@v4
        with:
          name: Forja3D-Windows
          path: dist-installer/*.exe
      # Microsoft Store package: free individual developer account, the Store signs it (no SmartScreen).
      # Set the repository variables MSIX_IDENTITY_NAME, MSIX_PUBLISHER and MSIX_PUBLISHER_DISPLAY
      # from Partner Center → Product identity to turn it on (see docs/firma-gratis.md).
      - name: Microsoft Store package (MSIX)
        if: ${{ vars.MSIX_PUBLISHER != '' }}
        env:
          MSIX_IDENTITY_NAME: ${{ vars.MSIX_IDENTITY_NAME }}
          MSIX_PUBLISHER: ${{ vars.MSIX_PUBLISHER }}
          MSIX_PUBLISHER_DISPLAY: ${{ vars.MSIX_PUBLISHER_DISPLAY }}
        run: python desktop/windows/make_msix.py
      - uses: actions/upload-artifact@v4
        if: ${{ vars.MSIX_PUBLISHER != '' }}
        with:
          name: Forja3D-Microsoft-Store
          path: dist-installer/*.msix

  macos:
    needs: tests
    runs-on: macos-latest  # Apple Silicon (M1/M2/M3/M4)
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip }
      - name: Install
        run: pip install -r backend/requirements.txt pywebview pyinstaller
      - name: Version
        run: |
          sed -i.bak -e "s/^VERSION = .*/VERSION = \"$APP_VERSION\"/" -e "s#^UPDATE_REPO = .*#UPDATE_REPO = \"$UPDATE_REPO\"#" backend/app/_version.py
          rm -f backend/app/_version.py.bak
      - name: Build app
        run: pyinstaller desktop/forja3d.spec --noconfirm
      - name: Smoke test (starts the packaged server)
        run: |
          dist/Forja3D.app/Contents/MacOS/Forja3D --server --port 8799 &
          for i in $(seq 60); do curl -sf http://127.0.0.1:8799/api/health && break; sleep 2; done
          curl -sf http://127.0.0.1:8799/ | grep -q FORJA
          kill %1
      - name: Disk image
        run: |
          mkdir dmg && cp -R dist/Forja3D.app dmg/ && ln -s /Applications dmg/Applications
          hdiutil create -volname Forja3D -srcfolder dmg -ov -format UDZO "Forja3D-${APP_VERSION}-mac-arm64.dmg"
      - uses: actions/upload-artifact@v4
        with:
          name: Forja3D-macOS
          path: "*.dmg"

  release:
    needs: [windows, macos]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with: { path: out, merge-multiple: true }
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: desktop-v${{ env.APP_VERSION }}
          target_commitish: ${{ github.sha }}
          name: Forja3D ${{ env.APP_VERSION }} (Windows + macOS)
          make_latest: true
          files: out/*
          body: |
            **Windows 10/11 (64 bits):** descarga `Forja3D-Setup-*.exe` y ejecútalo. Si Windows SmartScreen avisa, pulsa «Más información» → «Ejecutar de todas formas» (el instalador no está firmado).
            **macOS (Apple Silicon):** abre el `.dmg` y arrastra Forja3D a Aplicaciones. La primera vez: clic derecho sobre la app → «Abrir» (no está firmada por Apple).
            **IA gratis en tu GPU NVIDIA (Windows):** la app la instala y la arranca sola la primera vez (≈30 GB de descarga y 45 GB libres en disco, una sola vez; RTX 30, 40 o 50 con 8 GB o más). Sin claves ni tokens.
            Si ya tienes Forja3D, la app se actualiza sola: no hace falta descargar esto de nuevo.
      - name: Publish to the public releases repo
        if: ${{ vars.RELEASES_REPO != '' }}
        uses: softprops/action-gh-release@v2
        with:
          repository: ${{ vars.RELEASES_REPO }}
          token: ${{ secrets.RELEASES_TOKEN }}
          tag_name: desktop-v${{ env.APP_VERSION }}
          name: Forja3D ${{ env.APP_VERSION }}
          make_latest: true
          files: out/*
